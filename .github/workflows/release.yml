name: Create Release

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.1). For manual runs provide this value.'
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag to release
        id: set_tag
        run: |
          echo "Determining tag..."
        # This step is a placeholder; actual branching below

      - name: Set tag from workflow input (manual run)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: set_tag_input
        run: |
          if [ -z "${{ github.event.inputs.tag }}" ]; then
            echo "No tag provided as input to workflow_dispatch; please provide 'tag' input like v1.0.1" >&2
            exit 1
          fi
          echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Set tag from push ref (push run)
        if: ${{ github.event_name != 'workflow_dispatch' }}
        id: set_tag_ref
        run: |
          echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release for tag
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.set_tag_input.outputs.tag || steps.set_tag_ref.outputs.tag }}
          release_name: ${{ steps.set_tag_input.outputs.tag || steps.set_tag_ref.outputs.tag }}
          body: |
            Automated release for tag ${{ steps.set_tag_input.outputs.tag || steps.set_tag_ref.outputs.tag }}.
          draft: false
          prerelease: false

      - name: Update SCRIPT_VERSION in `regsync.sh` to tag version
        id: set_version
        env:
          TAG: ${{ steps.set_tag_input.outputs.tag || steps.set_tag_ref.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          echo "Setting SCRIPT_VERSION to '${VERSION}' in regsync.sh"
          if [[ ! -f "regsync.sh" ]]; then
            echo "regsync.sh not found in workspace" >&2
            exit 1
          fi
          # Replace the line starting with SCRIPT_VERSION= with the new version
          sed -E -i.bak "s/^SCRIPT_VERSION=.*/SCRIPT_VERSION=\"${VERSION}\"/" regsync.sh
          echo "Updated regsync.sh (first 30 lines):"
          sed -n '1,30p' regsync.sh

      - name: Upload `regsync.sh` as release asset named `regsync`
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./regsync.sh
          asset_name: regsync
          asset_content_type: text/x-sh